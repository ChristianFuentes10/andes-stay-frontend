<div class="auth-screen">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-mark">AS</div>
      <span class="brand-name">AndesStay</span>
    </div>

    <h1>Bienvenido</h1>
    <p class="subtitle">Inicia sesión con tu cuenta para ver el catálogo de unidades y gestionar tu estadía.</p>

    <button type="button" class="btn-primary" (click)="onLogin()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M10 17l5-5-5-5"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12H3"/>
      </svg>
      Iniciar sesión
    </button>

    <p class="hint">Serás redirigido a nuestro proveedor de identidad para autenticarte de forma segura.</p>
  </div>
</div>
